[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fling-layout"
version = "0.1.0"
description = "Graph layout by fitting a function of node features instead of a table of coordinates"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Daniel Probst" }]
keywords = ["graph-drawing", "graph-layout", "implicit-neural-representation", "stress"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

# s_gd2, fa2-modified and scikit-learn are required rather than optional because fling.metrics
# imports fling.baselines, so the metrics are unusable without them
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "torch>=2.0",
    "s_gd2>=1.8",
    "fa2-modified>=0.4",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]
large = ["datashader>=0.16", "pandas>=2.0", "colorcet>=3.0", "pynndescent>=0.5"]
all = [
    "matplotlib>=3.7",
    "datashader>=0.16",
    "pandas>=2.0",
    "colorcet>=3.0",
    "pynndescent>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["fling"]

[tool.hatch.build.targets.sdist]
include = ["fling", "scripts", "README.md"]
